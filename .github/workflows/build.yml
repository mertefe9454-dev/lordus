
name: Build LORDUS Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build JAR
        working-directory: LORDUS-Fabric-1.20.1
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LORDUS-JAR
          path: LORDUS-Fabric-1.20.1/build/libs/*.jar
